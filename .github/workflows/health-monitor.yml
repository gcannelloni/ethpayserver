name: Health monitor (deep)

# /api/health/deep can answer 200 while the money path is dead: evmmonitor
# stalls, monitor.data_fresh goes false, and every HTTP-status-only check
# stays green while invoices go unpaid. Nothing polled that field between
# deploys — health-gate.sh only runs when something deploys, and the daily
# e2e run is the only thing that touches testnet the rest of the time.
#
# This runs on GitHub-hosted runners on purpose, same reasoning as
# e2e-scheduled.yml: the deploy host cannot be trusted to report on itself
# being down.
#
# GitHub scheduled workflows are best-effort. Observed on this workflow: the
# large majority of scheduled runs are never dispatched, with gaps of hours
# against a 5-minute cron. Nothing time-sensitive may rely on this schedule.
#
# The 5-minute cadence is meant to be held elsewhere: the private
# central-infrastructure repository defines a one-minute systemd timer that polls the same endpoint.
# Whether it is enabled on the host is unverified from here; until it is,
# prompt outage detection is not in place.
# This workflow remains for manual dispatch and as a second, body-asserting
# check. Its Sentry cron monitor must therefore be sized to what GitHub
# actually delivers (hours), or be treated as advisory; it cannot be a
# 5-minute dead-man's switch. See docs/ops.md.
#
# STALL_THRESHOLD is left at 3 checks: it counts delivered runs, so at this
# cadence a flat chain is flagged late; the host timer bounds stall time.
#
# This is a body-asserting secondary check rather than a real uptime checker:
# it exists to assert on the response body (monitor.data_fresh, per-chain rpc
# status), which a status-code-only uptime check cannot do. A Sentry Uptime
# Check against the same URL gives the faster cadence; this stays as the
# thing that reads the body, when GitHub delivers it.
#
# A chain can report rpcs.*.status "ok" while its indexer has stopped
# advancing — status alone misses that. The actions/cache steps below persist
# each chain's last_block across runs so check-health-deep.sh can catch a
# block count that has gone flat, not just a chain that has gone unhealthy.
#
# One new cache entry per run (see the run_id in the key below) means this
# never stops accumulating entries on its own; relied on for cleanup is
# GitHub's automatic eviction of caches unused for 7 days and its 10GB-per-repo
# LRU cap, not anything in this workflow.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnet:
    name: Deep health (testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Each run is a fresh runner, so last_block from the previous check has
      # to come from somewhere else. This cache entry is that "somewhere
      # else" — restored before the check, saved back after regardless of
      # outcome, keyed per-run so the save is never a no-op cache hit.
      - name: Restore health state
        uses: actions/cache/restore@v4
        with:
          path: .health-state
          key: health-state-testnet-${{ github.run_id }}
          restore-keys: |
            health-state-testnet-
      - name: Check /api/health/deep
        env:
          HEALTH_URL: https://testnet.random.cash/api/health/deep
          SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_HEALTH_TESTNET_URL }}
          HEALTH_STATE_FILE: .health-state/testnet.json
        run: scripts/check-health-deep.sh
      - name: Save health state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-state
          key: health-state-testnet-${{ github.run_id }}

  mainnet:
    name: Deep health (mainnet)
    # Mainnet does not exist yet. Without this the job curls pay.random.cash
    # every five minutes forever and fails - 288 red runs a day, which is the
    # same alert-fatigue failure this whole change is meant to remove, one
    # layer up.
    #
    # A repository VARIABLE rather than a secret's presence: the check has to
    # be something a human turned on deliberately and can see is off. Skipping
    # on a missing secret is the silent no-op this PR removes elsewhere.
    #
    #   gh variable set MAINNET_LIVE --body 1 --repo gcannelloni/ethpayserver
    if: vars.MAINNET_LIVE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore health state
        uses: actions/cache/restore@v4
        with:
          path: .health-state
          key: health-state-mainnet-${{ github.run_id }}
          restore-keys: |
            health-state-mainnet-
      - name: Check /api/health/deep
        env:
          HEALTH_URL: https://pay.random.cash/api/health/deep
          SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_HEALTH_MAINNET_URL }}
          HEALTH_STATE_FILE: .health-state/mainnet.json
        run: scripts/check-health-deep.sh
      - name: Save health state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-state
          key: health-state-mainnet-${{ github.run_id }}
